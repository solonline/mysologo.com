services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yoop_app
    restart: unless-stopped
    env_file: .env
    volumes:
      - .:/var/www
      - /var/www/vendor
    depends_on:
      - mysql
      - redis
    networks:
      - yoop

  nginx:
    image: nginx:alpine
    container_name: yoop_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - .:/var/www
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - yoop

  mysql:
    image: mysql:8.0
    container_name: yoop_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - yoop

  redis:
    image: redis:7-alpine
    container_name: yoop_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - yoop

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yoop_queue
    restart: unless-stopped
    env_file: .env
    command: ["php", "artisan", "queue:work", "--queue=stripe-webhooks,didit-webhooks,default", "--tries=3", "--sleep=3"]
    volumes:
      - .:/var/www
      - /var/www/vendor
    depends_on:
      - mysql
      - redis
    networks:
      - yoop

volumes:
  mysql_data:

networks:
  yoop:
    driver: bridge
