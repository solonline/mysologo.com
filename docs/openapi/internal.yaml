  - name: Sistema
    tags: [Settings]

tags:
  - name: Auth
    description: Registo, login, PIN e recuperação de password. Respostas com **AuthSession**.
  - name: Onboarding
    description: Verificação de telefone por SMS.
  - name: Kyc
    description: Verificação de identidade (Didit).
  - name: Tpa
    description: Terminais físicos — associação e login.
  - name: Customer
    description: Perfil, documentos corporate, notificações.
  - name: Wallet
    description: Dashboard, conta, transacções e P2P.
  - name: Stripe
    description: Top-up via Stripe (cliente autenticado).
  - name: Wallester
    description: Cartões, transacções e 3DS Out-of-Band (cliente autenticado).
  - name: Merchant
    description: Payment requests e terminal. [Doc parceiros](/docs/partners).
  - name: Settings
    description: Configuração e informação do sistema.

