openapi: 3.1.0

info:
  title: Yoop API
  version: 1.0.0
  description: |
    # Documentação interna Yoop

    API REST modular — cada domínio vive em `/api/{dominio}/*`.

    ## Autenticação

    | Tipo | Header | Quando usar |
    |------|--------|-------------|
    | **Bearer (Sanctum)** | `Authorization: Bearer {token}` | App mobile, web app, customer API |
    | **Merchant Key** | `X-Merchant-Key: {key}` | POS, e-commerce, integradores |

    Token: `POST /auth/login` ou `POST /auth/register-retail`.

    ## Middlewares de elegibilidade

    Vários endpoints exigem **todos** estes middlewares:

    - `customer.active` — lifecycle `ACTIVE`
    - `customer.email.verified`
    - `customer.document.approved` — KYC aprovado

    Falha → `403` com `message` explicativa.

    ## Erros

    JSON com `message` + `status`. Fora de produção: `reason`, `channel`.

    ## Rate limits

    | Limite | Rotas | Máx. |
    |--------|-------|------|
    | `api` | Geral | 60/min |
    | `stripe-intent` | Payment intents, terminal merchant | 10/min |

    ## Idempotência

    Operações de pagamento exigem header `Idempotency-Key` (UUID).

    ## Fluxo de onboarding

    ```
    register → email → phone → KYC → provisioning → ACTIVE → wallet
    ```

    Login/registo devolvem `lifecycle`, `capabilities` e `integrations`.

    ## Guias conceituais

    Fluxos de negócio passo a passo: **[Guias](/docs/guides)** (onboarding, top-up, P2P, webhooks).

    Parceiros: **[Guias parceiros](/docs/partners/guides)**.

  contact:
    name: Equipa Yoop
    email: dev@yoop.test

