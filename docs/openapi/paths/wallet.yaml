wallet-health:
  get:
    tags: [Wallet]
    summary: Health check do domínio Wallet
    operationId: walletHealth
    responses:
      '200':
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/HealthCheck'

wallet-dashboard:
  get:
    tags: [Wallet]
    summary: Resumo do dashboard
    operationId: walletDashboard
    description: |
      Retorna saldos actuais e transacções recentes do customer.

      **Pré-requisitos:** conta `ACTIVE`, email e documento verificados.
    security:
      - bearerAuth: []
    responses:
      '200':
        description: Saldos e movimentos recentes
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/WalletDashboard'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'

wallet-dashboard-summary:
  get:
    tags: [Wallet]
    summary: Resumo do dashboard (alias)
    operationId: walletDashboardSummary
    description: Alias de `GET /wallet/dashboard` — mesma resposta.
    security:
      - bearerAuth: []
    responses:
      '200':
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/WalletDashboard'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'

wallet-account:
  get:
    tags: [Wallet]
    summary: Detalhes da conta (Stripe + Wallester)
    operationId: walletAccount
    description: |
      Dados de integração financeira: vIBAN, IBAN, status Stripe/Wallester, instruções de funding.

      Útil para ecrã "A minha conta" e transferências bancárias.
    security:
      - bearerAuth: []
    responses:
      '200':
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/AccountDetails'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'

wallet-account-balance:
  get:
    tags: [Wallet]
    summary: Saldos por moeda
    operationId: walletAccountBalance
    description: Lista simplificada de saldos disponíveis.
    security:
      - bearerAuth: []
    responses:
      '200':
        content:
          application/json:
            schema:
              type: object
              properties:
                balances:
                  type: array
                  items:
                    type: object
                    properties:
                      currency:
                        type: string
                      available:
                        type: integer
                      pending:
                        type: integer
      '403':
        $ref: '../components/responses.yaml#/Forbidden'

wallet-account-wallester-sync:
  post:
    tags: [Wallet]
    summary: Sincronizar saldo Wallester
    operationId: walletAccountWallesterSync
    description: |
      Obtém o saldo actual da conta Wallester via API do parceiro e persiste localmente.

      Útil antes de transferências P2P (o saldo P2P é debitado na Wallester).
    security:
      - bearerAuth: []
    parameters:
      - name: currency
        in: query
        schema:
          type: string
          example: EUR
    responses:
      '200':
        content:
          application/json:
            schema:
              type: object
              properties:
                wallester:
                  type: object
                  additionalProperties: true
      '422':
        $ref: '../components/responses.yaml#/ValidationError'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'

wallet-funding-account-movements:
  get:
    tags: [Wallet]
    summary: Movimentos da conta de funding (Wallester)
    operationId: walletFundingAccountMovements
    description: |
      Lista paginada de `funding_partner_movements` da conta Wallester local.

      Compras com câmbio vêm **unificadas**: `amount` é o total debitado na moeda da conta
      (`account_amount + fees_amount`). `original_amount` / `original_currency` são a compra
      no comerciante; `fees_amount` é o valor do câmbio (moeda da conta).

      Envios Wise entram como espelho interno, mas a resposta vem normalizada
      (`provider: wise`, `source_label: Wise`). `status` é `CustomerMovementStatus`,
      não o estado cru da Wise. Mostrar `status_label`. `sent` = pagamento enviado, não `completed`.

      **Não confundir** com `GET /wallester/transactions` (passthrough da API Wallester).

      Guia: [Extractos](/docs/guides/logica-sistema#12-extractos) · [Compras Wallester e câmbio](/docs/guides/wallester-card-movements).
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: ID local de `customer_wallester_accounts`
        schema:
          type: integer
    responses:
      '200':
        description: |
          Lista de movimentos. Cada item usa `status` + `status_label` normalizados.
          Os exemplos cobrem todas as possibilidades.
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: array
                  items:
                    $ref: '../components/schemas.yaml#/FundingPartnerMovement'
            examples:
              wisePending:
                summary: Wise pendente (incoming_payment_waiting)
                value:
                  data:
                    - id: 387
                      provider: wise
                      external_account_id: 7ff00c76-b343-443a-bf85-342ce6b887df
                      direction: out
                      type: account_transfer
                      type_label: Transferência Wise
                      source_label: Wise
                      is_p2p: false
                      amount: 50
                      currency: EUR
                      original_amount: null
                      original_currency: null
                      fees_amount: null
                      platform_fees_amount: null
                      transfer_group_id: e94409ab-6694-4520-bcf7-ef2a0bfb5339
