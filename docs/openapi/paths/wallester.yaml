wallester-health:
  get:
    tags: [Wallester]
    summary: Health check do domínio Wallester
    operationId: wallesterHealth
    responses:
      '200':
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas.yaml#/HealthCheck'
                - type: object
                  properties:
                    domain:
                      type: string
                      example: wallester

wallester-accounts-index:
  get:
    tags: [Wallester]
    summary: Listar contas Wallester
    operationId: wallesterAccountsIndex
    description: |
      Pesquisa contas na API Wallester (passthrough `SearchAccounts`).

      O backend percorre todas as páginas automaticamente e devolve **todas** as contas correspondentes aos filtros.

      **Filtros opcionais:** `name`, `external_id`, `is_main`, `company_id`, `person_id`, `order_field`, `order_direction`.
    security:
      - bearerAuth: []
    parameters:
      - name: name
        in: query
        schema:
          type: string
      - name: external_id
        in: query
        schema:
          type: string
      - name: is_main
        in: query
        schema:
          type: boolean
      - name: exceeding_credit_limit
        in: query
        schema:
          type: boolean
      - name: order_field
        in: query
        schema:
          type: string
          enum: [created_at, updated_at, balance, blocked_amount, available_amount, name, status]
      - name: order_direction
        in: query
        schema:
          type: string
          enum: [asc, desc]
      - name: company_id
        in: query
        schema:
          type: string
          format: uuid
      - name: person_id
        in: query
        schema:
          type: string
          format: uuid
    responses:
      '200':
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/WallesterAccountList'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '422':
        $ref: '../components/responses.yaml#/ValidationError'

wallester-accounts-show:
  get:
    tags: [Wallester]
    summary: Detalhe de conta Wallester
    operationId: wallesterAccountsShow
    description: |
      Retorna uma conta da API Wallester por UUID (passthrough).
    security:
      - bearerAuth: []
    parameters:
      - name: account
        in: path
        required: true
        description: UUID da conta na Wallester
        schema:
          type: string
          format: uuid
    responses:
      '200':
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '../components/schemas.yaml#/WallesterAccount'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'

wallester-cards-index:
  get:
    tags: [Wallester]
    summary: Listar os meus cartões
    operationId: wallesterCardsIndex
    description: |
      Lista os cartões **locais** do customer autenticado (`managed()`): `Active`, `Created`, `Blocked`, `Dispatched`, `Closed`.

      Não é um dump live da Wallester. Use `GET /wallester/cards/{card}` para o detalhe live.
    security:
      - bearerAuth: []
    responses:
      '200':
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: array
                  items:
                    $ref: '../components/schemas.yaml#/WallesterCard'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'

wallester-cards-issuance-quote:
  get:
    tags: [Wallester]
    summary: Cotação de emissão de cartão
    operationId: wallesterCardsIssuanceQuote
    description: |
      Devolve as taxas de emissão (virtual e físico) e se serão cobradas (`will_charge`).

      Virtual só cobra se **já** existir um cartão aberto. Físico cobra sempre que a taxa configurada for > 0.
    security:
      - bearerAuth: []
    responses:
      '200':
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '../components/schemas.yaml#/WallesterCardIssuanceQuote'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'

wallester-cards-store:
  post:
    tags: [Wallester]
    summary: Criar cartão
    operationId: wallesterCardsStore
    description: |
      Cria um cartão Wallester (Virtual ou Physical) na conta activa do customer.

      **Comportamento:**
      - Cartões **Virtual** em estado `Created` são **activados automaticamente** após criação
      - Cartões **Physical** ficam em `Created` — a activação é `POST /wallester/cards/{card}/activate-by-cvv` quando o plástico chega (`Dispatched`)
      - OOB 3DS é configurado com o `wallester_oob_id` da conta Wallester do customer
      - `internet_purchase_enabled` fica activo por defeito

      **Pré-requisitos:** conta Wallester `ACTIVE`, lifecycle `ACTIVE`, email e documento verificados.

      **PIN:** `pin` (4 dígitos do device) + `device_token` são obrigatórios.
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [type, name, pin, device_token]
            properties:
              type:
                type: string
                enum: [Virtual, Physical]
              name:
                type: string
                maxLength: 255
              pin:
                type: string
                pattern: '^[0-9]{4}$'
                description: PIN de 4 dígitos do dispositivo
              device_token:
                type: string
                description: Token do dispositivo registado com PIN
              limits:
                type: object
                additionalProperties: true
              security:
                type: object
                additionalProperties: true
              delivery_address:
                type: object
                description: Morada real do customer. Obrigatória se `type` for Physical. Não é enviada à Wallester.
                required: [address, city, first_name, last_name, phone, postal_code]
                properties:
                  address:
                    type: string
                    maxLength: 255
                  city:
                    type: string
                    maxLength: 255
                  state:
                    type: string
                    maxLength: 255
                  country:
                    type: string
                    minLength: 2
                    maxLength: 2
                    description: ISO 3166-1 alpha-2 (ex. PT)
                  first_name:
                    type: string
                    maxLength: 255
                  last_name:
                    type: string
                    maxLength: 255
                  phone:
                    type: string
                    maxLength: 255
                  postal_code:
                    type: string
                    maxLength: 255
          example:
            type: Virtual
            name: Travel Card
            pin: '1234'
            device_token: dev_xxx
    responses:
      '201':
        description: Cartão criado (e activado se Virtual)
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '../components/schemas.yaml#/WallesterCard'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '422':
        $ref: '../components/responses.yaml#/ValidationError'

wallester-cards-show:
  get:
    tags: [Wallester]
    summary: Detalhe de cartão Wallester
    operationId: wallesterCardsShow
    description: |
      Retorna os dados completos de um cartão na API Wallester (passthrough `GET /v1/cards/{card_id}`).

      O `{card}` no path é o ID local (`customer_wallester_cards.id`). O cartão deve pertencer ao customer autenticado.
    security:
      - bearerAuth: []
    parameters:
      - name: card
        in: path
        required: true
        description: ID local do cartão (`customer_wallester_cards.id`)
        schema:
          type: integer
    responses:
      '200':
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '../components/schemas.yaml#/WallesterCardApi'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'

wallester-cards-sensitive:
  post:
    tags: [Wallester]
    summary: Revelar dados sensíveis do cartão
    operationId: wallesterCardsSensitive
    description: |
      Obtém PAN, CVV e validade do cartão via endpoints encriptados da Wallester.

      Requer confirmação de identidade com **password da conta** ou **PIN do dispositivo** (`pin` + `device_token`).

      Requer `WALLESTER_CARD_RSA_PRIVATE_KEY` configurada no servidor. O backend desencripta e devolve os dados em plain text sobre HTTPS.

      **Pré-requisitos:** cartão `Active` ou `Blocked` e pertencente ao customer autenticado.
    security:
      - bearerAuth: []
    parameters:
      - name: card
        in: path
        required: true
        description: ID local do cartão (`customer_wallester_cards.id`)
        schema:
          type: integer
    requestBody:
      required: true
      content:
        application/json:
          schema:
            oneOf:
              - type: object
                required: [password]
                properties:
                  password:
                    type: string
                    format: password
                    description: Password da conta Yoop
              - type: object
                required: [pin, device_token]
                properties:
                  pin:
                    type: string
                    pattern: '^[0-9]{4}$'
                    description: PIN de 4 dígitos do dispositivo
                  device_token:
                    type: string
                    description: Token do dispositivo registado com PIN
    responses:
      '200':
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '../components/schemas.yaml#/WallesterCardSensitive'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '422':
        description: Cartão não elegível (estado inválido — só `Active` ou `Blocked`)

wallester-cards-encrypted-pin:
  post:
    tags: [Wallester]
    summary: Revelar PIN do cartão
    operationId: wallesterCardsEncryptedPin
    description: |
      Obtém o PIN do cartão via `POST /v1/cards/{id}/encrypted-pin` da Wallester.

      O backend envia a chave pública RSA (`WALLESTER_CARD_RSA_PRIVATE_KEY`), desencripta o payload OAEP (`PIN`) e devolve o PIN em plain text sobre HTTPS.

      Requer confirmação de identidade com **password da conta** ou **PIN do dispositivo** (`pin` + `device_token`).

      **Pré-requisitos:** cartão `Active` ou `Blocked` e pertencente ao customer autenticado.
    security:
      - bearerAuth: []
    parameters:
      - name: card
        in: path
        required: true
        description: ID local do cartão (`customer_wallester_cards.id`)
        schema:
          type: integer
    requestBody:
      required: true
      content:
        application/json:
          schema:
            oneOf:
              - type: object
                required: [password]
                properties:
                  password:
                    type: string
                    format: password
                    description: Password da conta Yoop
              - type: object
                required: [pin, device_token]
                properties:
                  pin:
                    type: string
                    pattern: '^[0-9]{4}$'
                    description: PIN de 4 dígitos do dispositivo
                  device_token:
                    type: string
                    description: Token do dispositivo registado com PIN
    responses:
      '200':
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '../components/schemas.yaml#/WallesterCardPin'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '422':
        description: Cartão não elegível (estado inválido — só `Active` ou `Blocked`)

wallester-cards-activate:
  post:
    tags: [Wallester]
    summary: Activar cartão virtual
    operationId: wallesterCardsActivate
    description: |
      Activa manualmente um cartão **Virtual** em estado `Created`.

      Idempotente se o cartão já estiver `Active`. Cartões **Physical** usam `POST /wallester/cards/{card}/activate-by-cvv`.
    security:
      - bearerAuth: []
    parameters:
      - name: card
        in: path
        required: true
        description: ID local do cartão (`customer_wallester_cards.id`)
        schema:
          type: integer
    responses:
      '200':
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '../components/schemas.yaml#/WallesterCard'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '422':
        description: Cartão não activável (tipo ou estado inválido)

wallester-cards-activate-by-cvv:
  post:
    tags: [Wallester]
    summary: Activar cartão físico por CVV
    operationId: wallesterCardsActivateByCvv
    description: |
      Activa um cartão **Physical** / **ChipAndPin** / **ChipAndPinAnonymous** com o CVV impresso no plástico.

      **Quando usar:** o cartão físico foi enviado (`Dispatched`) e o utilizador o recebeu. Também aceite em `Created` e `Personalized`. Idempotente se já estiver `Active`.

      **O que o sistema faz:**
      1. Sincroniza o status local com `GET /v1/cards/{id}` na Wallester
      2. Cifra o `cvv` (3 dígitos em claro) com RSA-OAEP SHA-256 (label vazio) usando `wallester.rsa_public_key`
      3. Envolve o ciphertext em `BEGIN/END MESSAGE` e Base64-encode o envelope PEM
      4. Chama `PATCH /v1/cards/{id}/activate-by-cvv` na Wallester
      5. Actualiza o cartão local para `Active`

      **Pré-requisitos:** tríade + ownership. Body: `pin` (device), `device_token`, `cvv` (3 dígitos).

      **Não activável** em `Blocked`, `Closed` ou `Closing`. Cartões **Virtual** usam `POST .../activate`.
    security:
      - bearerAuth: []
    parameters:
      - name: card
        in: path
        required: true
        description: ID local do cartão (`customer_wallester_cards.id`)
        schema:
          type: integer
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [pin, device_token, cvv]
            properties:
              pin:
                type: string
                pattern: '^[0-9]{4}$'
                description: PIN de 4 dígitos do dispositivo (não o PIN do cartão)
              device_token:
                type: string
                description: Token do dispositivo registado com PIN
              cvv:
                type: string
                pattern: '^[0-9]{3}$'
                description: CVV impresso no cartão (3 dígitos, em claro). O servidor cifra antes de enviar à Wallester.
          example:
            pin: '1234'
            device_token: dev_xxx
            cvv: '123'
    responses:
      '200':
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '../components/schemas.yaml#/WallesterCard'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '422':
        description: Cartão não activável (tipo Virtual, ou estado Blocked/Closed)

wallester-cards-block:
  post:
    tags: [Wallester]
    summary: Bloquear / congelar cartão
    operationId: wallesterCardsBlock
    description: |
      Congela um cartão em estado `Active` (`BlockedByCardUser`). Idempotente se já estiver `Blocked`.

      Exige PIN do device. Depois de bloqueado, o utilizador pode desbloquear (`POST .../unblock`) e ainda revelar dados (`sensitive` / `encrypted-pin`).
    security:
      - bearerAuth: []
    parameters:
      - name: card
        in: path
        required: true
        description: ID local do cartão (`customer_wallester_cards.id`)
        schema:
          type: integer
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [pin, device_token]
            properties:
              pin:
                type: string
                pattern: '^[0-9]{4}$'
              device_token:
                type: string
          example:
            pin: '1234'
            device_token: dev_xxx
    responses:
      '200':
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '../components/schemas.yaml#/WallesterCard'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '422':
        description: Cartão não bloqueável no estado actual (só `Active`)

wallester-cards-unblock:
  post:
    tags: [Wallester]
    summary: Desbloquear cartão
    operationId: wallesterCardsUnblock
    description: |
      Descongela um cartão em estado `Blocked`. Idempotente se já estiver `Active`.

      Exige PIN do device. Não aplica a cartões `Dispatched` — esses activam-se com `POST .../activate-by-cvv`.
    security:
      - bearerAuth: []
    parameters:
      - name: card
        in: path
        required: true
        description: ID local do cartão (`customer_wallester_cards.id`)
        schema:
          type: integer
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [pin, device_token]
            properties:
              pin:
                type: string
                pattern: '^[0-9]{4}$'
              device_token:
                type: string
          example:
            pin: '1234'
            device_token: dev_xxx
    responses:
      '200':
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '../components/schemas.yaml#/WallesterCard'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '422':
        description: Cartão não desbloqueável no estado actual (só `Blocked`)

wallester-cards-close:
  post:
    tags: [Wallester]
    summary: Fechar cartão
    operationId: wallesterCardsClose
    description: |
      Encerra um cartão `Active` ou `Blocked` (`Closed` / `Closing`). Exige PIN do device.

      Irreversível do ponto de vista de produto. Cartão `Closed` não pode ser bloqueado, desbloqueado, activado nem revelar dados.
    security:
      - bearerAuth: []
    parameters:
      - name: card
        in: path
        required: true
        description: ID local do cartão (`customer_wallester_cards.id`)
        schema:
          type: integer
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [pin, device_token]
            properties:
              pin:
                type: string
                pattern: '^[0-9]{4}$'
              device_token:
                type: string
          example:
            pin: '1234'
            device_token: dev_xxx
    responses:
      '200':
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '../components/schemas.yaml#/WallesterCard'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '422':
        description: Cartão não fechável no estado actual (só `Active` ou `Blocked`)

wallester-3ds-challenges-pending:
  get:
    tags: [Wallester]
    summary: Listar desafios 3DS pendentes
    operationId: wallester3dsChallengesPending
    description: |
      Lista desafios 3DS Out-of-Band pendentes do customer autenticado.

      O cliente deve aprovar ou rejeitar cada desafio antes de `expires_at`.
