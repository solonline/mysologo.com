kyc-health:
  get:
    tags: [Kyc]
    summary: Health check do domínio Kyc
    operationId: kycHealth
    responses:
      '200':
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/HealthCheck'

kyc-identity-session:
  post:
    tags: [Kyc]
    summary: Criar sessão de verificação de identidade
    operationId: kycIdentitySession
    description: |
      Cria ou reutiliza sessão Didit para KYC individual ou KYB corporate.

      **Quando usar:**
      - `identity_verification.session` é `null` mas o utilizador precisa de verificar
      - Status `Expired`, `Abandoned` ou `Declined` no login
      - Após login-pin quando não veio `verification_url`

      **Resposta:** formato legado com `session_url` (não `verification_url`).
      Ver [AuthSession — identity_verification](/docs/guides/auth-session#identity_verification) para mapeamento de campos.

      O webhook `POST /api/webhooks/didit` actualiza o estado quando o utilizador conclui.
    security:
      - bearerAuth: []
    responses:
      '200':
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/IdentitySession'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '422':
        description: KYC já aprovado ou conta não elegível
