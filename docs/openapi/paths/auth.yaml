auth-health:
  get:
    tags: [Auth]
    summary: Health check do domínio Auth
    operationId: authHealth
    responses:
      '200':
        description: Serviço disponível
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/HealthCheck'

auth-register-retail:
  post:
    tags: [Auth]
    summary: Registo de cliente retail
    operationId: authRegisterRetail
    description: |
      Cria uma conta **retail** e devolve sessão autenticada (`AuthSession`).

      **Pós-registo:** o lifecycle inicia em `PENDING_EMAIL_VERIFICATION`.
      Um email de validação é enviado automaticamente.

      **Campos obrigatórios:** `name`, `email`, `username`, `password`, `phone`, `currency`.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, email, username, password, phone, currency]
            properties:
              name:
                type: string
                maxLength: 200
              email:
                type: string
                format: email
              username:
                type: string
                pattern: '^[a-zA-Z0-9_]+$'
              password:
                type: string
                minLength: 6
              phone:
                type: string
                description: Apenas dígitos, sem espaços
              currency:
                type: string
                minLength: 3
                maxLength: 3
                example: EUR
              language:
                type: string
                maxLength: 5
                example: pt
          example:
            name: John Doe
            email: john@example.com
            username: johndoe
            password: secret123
            phone: '351912345678'
            currency: EUR
            language: pt
    responses:
      '201':
        description: Conta criada
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/AuthSession'
      '422':
        $ref: '../components/responses.yaml#/ValidationError'

auth-register-corporate:
  post:
    tags: [Auth]
    summary: Registo de cliente corporate
    operationId: authRegisterCorporate
    description: |
      Cria conta **corporate** (empresa). Após registo, pode ser necessário
      criar responsável e submeter documentos em `/customer/*`.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, username, email, tax_id, password, country_code]
            properties:
              name:
                type: string
              username:
                type: string
              email:
                type: string
                format: email
              tax_id:
                type: string
              password:
                type: string
                minLength: 6
              country_code:
                type: string
                example: PT
    responses:
      '201':
        description: Conta corporate criada
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/AuthSession'
      '422':
        $ref: '../components/responses.yaml#/ValidationError'

auth-login:
  post:
    tags: [Auth]
    summary: Login com email e password
    operationId: authLogin
    description: |
      Autentica um cliente e devolve `AuthSession` com token Sanctum.

      Use o token em todos os endpoints protegidos:
      `Authorization: Bearer {token}`

      **Campos principais:**
      - `lifecycle.status` — ecrã de onboarding
      - `capabilities` — permissões actuais (`can_transact`, …)
      - `integrations` — Stripe / Wallester / Ebury + `iban` quando provisionado
      - `identity_verification` — sessão KYC (condicional; `null` se já aprovado)

      📖 [Referência completa AuthSession](/docs/guides/auth-session)
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, password]
            properties:
              email:
                type: string
                format: email
              password:
                type: string
          example:
            email: john@example.com
            password: secret123
    responses:
      '200':
        description: Login bem-sucedido
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/AuthSession'
            examples:
              accountActive:
                summary: Conta ACTIVE — KYC aprovado
                value:
                  token: '1|example-token'
                  user:
                    id: 1
                    name: John Doe
                    username: johndoe
                    type: retail
                    email: john@example.com
                    language: pt
                    currency: EUR
                    phone: '351912345678'
                  lifecycle:
                    status: ACTIVE
                    label: Ativo
                    is_negative: false
                    reason: null
                  capabilities:
                    can_use_platform: true
                    can_transact: true
                    can_top_up_stripe: true
                    can_withdraw_wallester: true
                    can_receive_ebury: false
                    blockers: []
                  integrations:
                    stripe:
                      provider: stripe
                      label: Stripe
                      status: ACTIVE
                      iban:
                        iban: DE89370400440532013000
                        bic: COBADEFFXXX
                        account_holder_name: John Doe
                        funding_status: ACTIVE
                    wallester:
                      provider: wallester
                      label: Wallester
                      status: ACTIVE
                      iban: null
                    ebury:
                      provider: ebury
                      label: Ebury
                      status: PENDING
                      iban: null
                  onboarding:
                    requires_responsible: false
                    message: null
                  verification:
                    email: true
                    phone: true
                    identity: APPROVED
                  identity_verification: null
              kycInProgress:
                summary: KYC em curso — sessão com verification_url
                value:
                  token: '1|example-token'
                  lifecycle:
                    status: PENDING_IDENTITY_VERIFICATION
                    label: Aguardando identidade
                    is_negative: false
                  verification:
                    email: true
                    phone: true
                    identity: PENDING
                  identity_verification:
                    status: In Progress
                    session:
                      id: 12
                      customer_id: 3
                      status: In Progress
                      external_session_id: d54203d5-1dee-44c8-bbdb-ebe1fc1418ef
                      verification_url: https://verify.didit.me/en/session/example
                      callback_url: https://yooppayments.eu/verification-pending
                      metadata:
                        application_id: c159a625-9dde-444c-990d-9accf2298448
              kycInReview:
                summary: Documentos em análise — session null
                value:
                  lifecycle:
                    status: IDENTITY_UNDER_REVIEW
                  verification:
                    identity: ANALYSING
                  identity_verification:
                    status: In Review
                    session: null
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '422':
        $ref: '../components/responses.yaml#/ValidationError'

auth-login-pin:
  post:
    tags: [Auth]
    summary: Login com PIN do dispositivo
    operationId: authLoginPin
    description: |
      Login rápido para mobile usando `device_token` + PIN de 4 dígitos.
      O PIN deve ter sido criado previamente em `POST /auth/create-pin`.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, device_token, pin]
            properties:
              email:
                type: string
                format: email
              device_token:
                type: string
              pin:
                type: string
                minLength: 4
                maxLength: 4
    responses:
      '200':
        description: Sessão autenticada
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/AuthSession'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '422':
        $ref: '../components/responses.yaml#/ValidationError'

auth-logout:
  post:
    tags: [Auth]
    summary: Terminar sessão
    operationId: authLogout
    security:
      - bearerAuth: []
    responses:
      '200':
        description: Token revogado
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/MessageResponse'
            example:
              message: Logged out successfully

auth-forgot-password:
  post:
    tags: [Auth]
    summary: Pedir reset de password
    operationId: authForgotPassword
    description: Envia email com link/token de recuperação.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email]
            properties:
              email:
                type: string
                format: email
    responses:
      '200':
        description: Email enviado (se a conta existir)

auth-reset-password:
  post:
    tags: [Auth]
    summary: Definir nova password
    operationId: authResetPassword
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, token, password, password_confirmation]
            properties:
              email:
                type: string
                format: email
              token:
                type: string
              password:
                type: string
              password_confirmation:
                type: string
    responses:
      '200':
        description: Password actualizada
      '422':
        $ref: '../components/responses.yaml#/ValidationError'

auth-create-pin:
  post:
    tags: [Auth]
    summary: Criar PIN do dispositivo
    operationId: authCreatePin
    description: |
      Regista um dispositivo móvel com PIN para login rápido.

      **Pré-requisitos (middleware):**
      - Conta activa
      - Email verificado
      - Documento/KYC aprovado
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [device_token, device_name, pin]
            properties:
              device_token:
                type: string
                description: Identificador único do dispositivo
              device_name:
                type: string
                example: iPhone 15
              pin:
                type: string
                minLength: 4
                maxLength: 4
    responses:
      '201':
        description: PIN criado
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '422':
        $ref: '../components/responses.yaml#/ValidationError'

auth-reset-pin:
  post:
    tags: [Auth]
    summary: Refazer PIN do dispositivo
    operationId: authResetPin
    description: |
      Altera o PIN de 4 dígitos do dispositivo após confirmar identidade.

      **Confirmação:** enviar `current_pin` + `device_token` **ou** `password` da conta.

      **Pré-requisitos (middleware):** conta activa, email verificado, KYC aprovado.
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [device_token, pin]
            properties:
              device_token:
                type: string
              pin:
                type: string
                minLength: 4
                maxLength: 4
                description: Novo PIN
              current_pin:
                type: string
                minLength: 4
                maxLength: 4
              password:
                type: string
                format: password
    responses:
      '200':
        description: PIN actualizado
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '422':
        $ref: '../components/responses.yaml#/ValidationError'
