merchant-health:
  get:
    tags: [Merchant]
    summary: Health check do domínio Merchant
    operationId: merchantHealth
    responses:
      '200':
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/HealthCheck'

merchant-payment-requests:
  post:
    tags: [Merchant]
    x-partners: true
    summary: Criar pedido de pagamento
    operationId: merchantCreatePaymentRequest
    description: |
      Cria um link de pagamento público (`/pay/{uuid}`) para o merchant autenticado.

      **Autenticação:** `X-Merchant-Key` (não usar Bearer neste endpoint).

      **Rate limit:** 120 pedidos/minuto **por merchant**.

      **Fluxo típico:**
      1. Criar payment request → receber `url`
      2. Redireccionar o pagador para `url` (browser ou iframe `?embed=1`)
      3. Cliente paga na página Yoop; a loja confirma no webhook HMAC

      **Iframe:** card com largura máx. 384px; sugerido `width=400`, `height=720`
      (altura dinâmica — ver [guia payment-requests](/docs/partners/guides/payment-requests)).

      **Settlement:** o webhook de `completed` inclui `settlement_status` (`pending` até
      liquidação, `available` quando os fundos estão na wallet) e `funds_available`.
      O primeiro envio pode ter `fee_total` / `net_amount` / `funds_available_at` a `null`;
      a Yoop reenvia quando o Stripe confirma as taxas.
    security:
      - merchantKey: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [amount]
            properties:
              amount:
                type: integer
                minimum: 1
                description: Valor em cêntimos
              description:
                type: string
                maxLength: 500
              external_reference:
                type: string
                maxLength: 255
                description: ID no sistema do parceiro
              payer_name:
                type: string
              payer_email:
                type: string
                format: email
              payer_phone:
                type: string
              webhook_url:
                type: string
                format: uri
                description: URL do webhook deste pedido (opcional; fallback = webhook_url do merchant)
              metadata:
                type: object
                additionalProperties: true
              items:
                type: array
                description: |
                  Opcional. Lista de artigos a exibir na página de pagamento (`/pay/{uuid}`).
                  Se omitido, a secção de artigos não aparece no checkout.
                items:
                  type: object
                  required: [name, quantity, unit_price]
                  properties:
                    name:
                      type: string
                      description: Nome do artigo
                    quantity:
                      type: number
                      description: Quantidade
                    unit_price:
                      type: integer
                      minimum: 0
                      description: Preço unitário em cêntimos
                  example:
                    name: Café
                    quantity: 2
                    unit_price: 150
              expires_in:
                type: integer
                minimum: 5
                maximum: 1440
                description: Minutos até expirar (omitir = 1 ano)
              language:
                type: string
                maxLength: 5
              payment_method_type:
                type: string
                description: Alias singular de `payment_method_types` (`card` ou `mb_way`; aliases `mbway`, `mb-way`).
              payment_method_types:
                type: array
                description: |
                  Opcional. `card` e/ou `mb_way`. Se omitido, a página de pagamento
                  apresenta os métodos disponíveis automaticamente.
                items:
                  type: string
                  enum: [card, mb_way]
          example:
            amount: 5000
            description: 'Order #123'
            external_reference: ORD-123
            items:
              - name: Café
                quantity: 2
                unit_price: 150
              - name: Croissant
                quantity: 1
                unit_price: 200
    responses:
      '201':
        description: Payment request criado
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/MerchantPaymentRequest'
            example:
              uuid: "9f3c2a1b-4d5e-6f70-8192-a3b4c5d6e7f8"
              amount: 5000
              currency: EUR
              description: "Order #123"
              external_reference: ORD-123
              payment_method_types:
                - card
                - mb_way
              status: pending
              settlement_status: null
              url: "https://api.yooppayments.eu/pay/9f3c2a1b-4d5e-6f70-8192-a3b4c5d6e7f8"
              paid_at: null
              expires_at: "2026-07-23T13:00:00+01:00"
              created_at: "2026-07-23T12:00:00+01:00"
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '422':
        $ref: '../components/responses.yaml#/ValidationError'
      '429':
        $ref: '../components/responses.yaml#/RateLimited'

