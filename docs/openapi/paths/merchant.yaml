merchant-health:
  get:
    tags: [Merchant]
    summary: Health check do domínio Merchant
    operationId: merchantHealth
    responses:
      '200':
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/HealthCheck'

merchant-index:
  get:
    tags: [Merchant]
    summary: Listar merchants do customer autenticado
    operationId: merchantIndex
    security:
      - bearerAuth: []
    responses:
      '200':
        description: Lista de merchants
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'

merchant-customer-payment-requests:
  get:
    tags: [Merchant]
    summary: Listar payment requests (vendas) do customer
    operationId: merchantCustomerPaymentRequests
    description: |
      Lista vendas/pedidos dos merchants do customer autenticado.
      Pedidos `completed` incluem `settlement_status` (`pending` até liquidação dos fundos).
      Não misturar com movimentos/wallet — usar esta lista para vendas.
    security:
      - bearerAuth: []
    parameters:
      - name: per_page
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
    responses:
      '200':
        description: Lista de payment requests
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: array
                  items:
                    $ref: '../components/schemas.yaml#/MerchantPaymentRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'

merchant-register:
  post:
    tags: [Merchant]
    summary: Registar customer como merchant
    operationId: merchantRegister
    description: |
      Converte o customer autenticado em merchant (uso interno / app).
      Devolve `api_key` e `webhook_secret` **uma vez** no corpo da resposta
      (`additional` / root) — guardar com segurança; o secret assina webhooks HMAC.
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name]
            properties:
              name:
                type: string
                maxLength: 150
                description: Nome comercial do merchant
              mode:
                type: string
                enum: [test, live]
                default: test
              webhook_url:
                type: string
                format: uri
              allowed_currencies:
                type: array
                items:
                  type: string
                  minLength: 3
                  maxLength: 3
          example:
            name: My Shop
            mode: test
    responses:
      '201':
        description: |
          Merchant criado. Inclui `api_key` e `webhook_secret` (mostrar só nesta resposta).
          Webhooks usam HMAC (`X-Yoop-Signature`) com o `webhook_secret`.
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '422':
        $ref: '../components/responses.yaml#/ValidationError'

merchant-customer-update:
  patch:
    tags: [Merchant]
    summary: Actualizar merchant
    operationId: merchantCustomerUpdate
    description: |
      Actualiza campos do merchant do customer autenticado.
      Envie pelo menos um de: `name`, `slug`, `webhook_url`, `mode`.
    security:
      - bearerAuth: []
    parameters:
      - name: merchant
        in: path
        required: true
        schema:
          type: integer
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
                maxLength: 150
              slug:
                type: string
                maxLength: 150
                description: Único (letras, números, hífen e underscore)
              webhook_url:
                type: string
                format: uri
                nullable: true
              mode:
                type: string
                enum: [test, live]
          example:
            name: Loja Nova
            slug: loja-nova
            webhook_url: https://loja.com/webhook/yoop
            mode: live
    responses:
      '200':
        description: Merchant actualizado
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '../components/schemas.yaml#/Merchant'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '422':
        $ref: '../components/responses.yaml#/ValidationError'

merchant-customer-credentials:
  get:
    tags: [Merchant]
    summary: Ver credenciais do merchant
    operationId: merchantCustomerCredentials
    description: |
      Devolve o `webhook_secret` actual. A `api_key` é hashed e **não** é recuperável
      (`api_key_retrievable: false`). Para obter uma nova key, use rotate.
    security:
      - bearerAuth: []
    parameters:
      - name: merchant
        in: path
        required: true
        schema:
          type: integer
    responses:
      '200':
        description: Credenciais (sem api_key em claro)
        content:
          application/json:
            schema:
              type: object
              properties:
                api_key_retrievable:
                  type: boolean
                  enum: [false]
                webhook_secret:
                  type: string
                  nullable: true
                data:
                  $ref: '../components/schemas.yaml#/Merchant'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
  post:
    tags: [Merchant]
    summary: Rodar api_key ou webhook_secret
    operationId: merchantCustomerCredentialsRotate
    description: |
      Gera um novo valor — exactamente um de `api_key` ou `webhook_secret` por pedido.
      O valor novo é devolvido **uma vez**. Se rodar a key, a antiga deixa de funcionar.
    security:
      - bearerAuth: []
    parameters:
      - name: merchant
        in: path
        required: true
        schema:
          type: integer
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              api_key:
                type: boolean
                description: Gerar nova API key (mutuamente exclusivo com webhook_secret)
              webhook_secret:
                type: boolean
                description: Gerar novo webhook secret (mutuamente exclusivo com api_key)
          example:
            api_key: true
    responses:
      '200':
        description: Novo segredo rodado
        content:
          application/json:
            schema:
              type: object
              properties:
                api_key:
                  type: string
                webhook_secret:
                  type: string
                data:
                  $ref: '../components/schemas.yaml#/Merchant'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '422':
        $ref: '../components/responses.yaml#/ValidationError'

merchant-payment-requests:
  post:
    tags: [Merchant]
    x-partners: true
    summary: Criar pedido de pagamento
    operationId: merchantCreatePaymentRequest
    description: |
      Cria um link de pagamento público (`/pay/{uuid}`) para o merchant autenticado.

      **Autenticação:** `X-Merchant-Key` (não usar Bearer neste endpoint).

      **Rate limit:** 10 pedidos/minuto.

      **Fluxo típico:**
      1. Criar payment request → receber `url`
      2. Redirecionar cliente para `url` (browser ou iframe)
      3. Cliente paga na página Yoop

      **Iframe:** card com largura máx. 384px; sugerido `width=400`, `height=720`
      (altura dinâmica — ver guia payment-requests).

      **Settlement:** após pagamento, o webhook inclui `settlement_status=pending` e
      `funds_available=false` até liquidação dos fundos.
    security:
      - merchantKey: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [amount]
            properties:
              amount:
                type: integer
                minimum: 1
                description: Valor em cêntimos
              description:
                type: string
                maxLength: 500
              external_reference:
                type: string
                maxLength: 255
                description: ID no sistema do parceiro
              payer_name:
                type: string
              payer_email:
                type: string
                format: email
              payer_phone:
                type: string
              webhook_url:
                type: string
                format: uri
                description: URL do webhook deste pedido (opcional; fallback = webhook_url do merchant)
              metadata:
                type: object
                additionalProperties: true
              items:
                type: array
                description: |
                  Opcional. Lista de artigos a exibir na página de pagamento (`/pay/{uuid}`).
                  Se omitido, a secção de artigos não aparece no checkout.
                items:
                  type: object
                  required: [name, quantity, unit_price]
                  properties:
                    name:
                      type: string
                      description: Nome do artigo
                    quantity:
                      type: number
                      description: Quantidade
                    unit_price:
                      type: integer
                      minimum: 0
                      description: Preço unitário em cêntimos
                  example:
                    name: Café
                    quantity: 2
                    unit_price: 150
              expires_in:
                type: integer
                minimum: 5
                maximum: 1440
                description: Minutos até expirar (omitir = 1 ano)
              language:
                type: string
                maxLength: 5
              payment_method_types:
                type: array
                items:
                  type: string
                  enum: [card, mb_way]
          example:
            amount: 5000
            description: 'Order #123'
            external_reference: ORD-123
            items:
              - name: Café
                quantity: 2
                unit_price: 150
              - name: Croissant
                quantity: 1
                unit_price: 200
    responses:
      '201':
        description: Payment request criado
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/MerchantPaymentRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '422':
        $ref: '../components/responses.yaml#/ValidationError'
      '429':
        $ref: '../components/responses.yaml#/RateLimited'

merchant-terminal-connection-token:
  post:
    tags: [Merchant]
    x-partners: true
    summary: Token de ligação do terminal
    operationId: merchantTerminalConnectionToken
    description: |
      Obtém `secret` para inicializar o SDK do terminal no POS.

      Enviar `currency` opcional (default `eur`).
    security:
      - merchantKey: []
    requestBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              currency:
                type: string
                example: eur
    responses:
      '200':
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/TerminalConnectionToken'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '429':
        $ref: '../components/responses.yaml#/RateLimited'

merchant-terminal-create-intent:
  post:
    tags: [Merchant]
    x-partners: true
    summary: Criar PaymentIntent para terminal
    operationId: merchantTerminalCreateIntent
    description: |
      Cria PaymentIntent card-present para top-up via TPA.

      **Headers obrigatórios:**
      - `X-Merchant-Key`
      - `Idempotency-Key` (UUID único por tentativa)

      **Valores:** `amount` em menor unidade monetária (cêntimos).
    security:
      - merchantKey: []
    parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
        description: Evita duplicação em retries
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [tpa_serial_number, amount]
            properties:
              tpa_serial_number:
                type: string
                description: Serial do TPA activo do merchant
              amount:
                type: integer
                minimum: 1
              currency:
                type: string
                minLength: 3
                maxLength: 3
                default: eur
          example:
            tpa_serial_number: TPA-001
            amount: 2000
            currency: EUR
    responses:
      '201':
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/TerminalPaymentIntent'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '422':
        $ref: '../components/responses.yaml#/ValidationError'
      '429':
        $ref: '../components/responses.yaml#/RateLimited'
