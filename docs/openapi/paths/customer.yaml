customer-health:
  get:
    tags: [Customer]
    summary: Health check do domínio Customer
    operationId: customerHealth
    responses:
      '200':
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/HealthCheck'

customer-me:
  get:
    tags: [Customer]
    summary: Perfil do customer autenticado
    operationId: customerMe
    description: |
      Perfil completo com estado de verificação (email, telefone, KYC) e sessão Didit activa se existir.

      Use após login para renderizar o ecrã inicial da app.
    security:
      - bearerAuth: []
    responses:
      '200':
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/CustomerProfile'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'

customer-update:
  post:
    tags: [Customer]
    summary: Actualizar perfil
    operationId: customerUpdate
    description: Actualização parcial — envie apenas os campos a alterar.
    security:
      - bearerAuth: []
    requestBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
                maxLength: 200
              username:
                type: string
                pattern: '^[a-zA-Z0-9_]+$'
              email:
                type: string
                format: email
              phone:
                type: string
              password:
                type: string
                minLength: 8
    responses:
      '200':
        description: Perfil actualizado
      '422':
        $ref: '../components/responses.yaml#/ValidationError'

customer-phone-request:
  post:
    tags: [Customer]
    summary: Pedir alteração de telefone
    operationId: customerPhoneRequest
    description: |
      Envia um OTP por SMS para o **novo** número. O perfil só actualiza após
      `POST /customer/phone/confirm`.

      Usar quando o telefone actual **já está verificado**. Durante o onboarding,
      se o número ainda não estiver verificado, corrigir com `POST /onboarding/phone/send`.
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [phone]
            properties:
              phone:
                type: string
                description: Novo número, só dígitos
                example: '351922222222'
    responses:
      '200':
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/PhoneChangeResult'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '422':
        $ref: '../components/responses.yaml#/ValidationError'
      '502':
        description: Falha ao enviar o SMS

customer-phone-confirm:
  post:
    tags: [Customer]
    summary: Confirmar alteração de telefone
    operationId: customerPhoneConfirm
    description: |
      Valida o código SMS enviado ao novo número e só então actualiza `customer.phone`.
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [phone, code]
            properties:
              phone:
                type: string
                example: '351922222222'
              code:
                type: string
                example: '123456'
    responses:
      '200':
        description: Telefone actualizado
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                customer:
                  $ref: '../components/schemas.yaml#/Customer'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '422':
        $ref: '../components/responses.yaml#/ValidationError'

customer-upload-avatar:
  post:
    tags: [Customer]
    summary: Upload de avatar
    operationId: customerUploadAvatar
    description: 'Multipart: campo `avatar` (JPG, PNG, WEBP — máx. 2MB).'
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [avatar]
            properties:
              avatar:
                type: string
                format: binary
    responses:
      '200':
        description: Avatar actualizado
      '422':
        $ref: '../components/responses.yaml#/ValidationError'

customer-find-by-username:
  get:
    tags: [Customer]
    summary: Procurar customer por username
    operationId: customerFindByUsername
    description: Dados públicos limitados — usado antes de P2P para confirmar destinatário.
    security:
      - bearerAuth: []
    parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
          pattern: '^[a-zA-Z0-9_]+$'
    responses:
      '200':
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/PublicCustomer'
      '404':
        $ref: '../components/responses.yaml#/NotFound'

customer-favorites:
  get:
    tags: [Customer]
    summary: Listar favoritos P2P
    operationId: customerFavoritesList
    description: |
      Perfis públicos dos customers guardados como favoritos. Mais recentes primeiro.

      Contas inactivas ou sem KYC aprovado são omitidas.
    security:
      - bearerAuth: []
    responses:
      '200':
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: array
                  items:
                    $ref: '../components/schemas.yaml#/PublicCustomer'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
  post:
    tags: [Customer]
    summary: Adicionar favorito P2P
    operationId: customerFavoritesAdd
    description: |
      Guarda um customer activo e com KYC aprovado como favorito, sem fazer transferência.

      Idempotente. No P2P, `favorite: true` continua a gravar o destinatário automaticamente.
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [username]
            properties:
              username:
                type: string
                pattern: '^[a-zA-Z0-9_]+$'
                example: janedoe
    responses:
      '201':
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/PublicCustomer'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '422':
        $ref: '../components/responses.yaml#/ValidationError'

customer-favorites-remove:
  delete:
    tags: [Customer]
    summary: Remover favorito P2P
    operationId: customerFavoritesRemove
    description: |
      Remove um favorito pelo username. Idempotente se o customer já não for favorito.
      Permite limpar favoritos mesmo que a conta deixe de estar activa.
    security:
      - bearerAuth: []
    parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
          pattern: '^[a-zA-Z0-9_]+$'
    responses:
      '200':
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Favorite removed successfully
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '422':
        $ref: '../components/responses.yaml#/ValidationError'

customer-send-validation-email:
  post:
    tags: [Customer]
    summary: Reenviar email de validação
    operationId: customerSendValidationEmail
    security:
      - bearerAuth: []
    responses:
      '200':
        description: Email enviado

customer-create-responsible:
  post:
    tags: [Customer]
    summary: Criar responsável (corporate)
    operationId: customerCreateResponsible
    description: |
      Para contas **corporate**: regista o responsável legal que fará KYC individual.

      Só aplicável quando `requires_responsible` é `true`.
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, username, email]
            properties:
              name:
                type: string
              username:
                type: string
              email:
                type: string
                format: email
    responses:
      '201':
        description: Responsável criado
      '422':
        $ref: '../components/responses.yaml#/ValidationError'

customer-submit-corporate-documents:
  post:
    tags: [Customer]
    summary: Submeter documento corporate
    operationId: customerSubmitCorporateDocuments
    description: 'Upload PDF do documento da empresa. Campo `country`: código ISO 3166-1 alpha-2.'
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [document, country]
            properties:
              document:
                type: string
                format: binary
              country:
                type: string
                minLength: 2
                maxLength: 2
                example: PT
    responses:
      '200':
        description: Documento recebido
      '422':
        $ref: '../components/responses.yaml#/ValidationError'

customer-notifications-list:
  get:
    tags: [Customer]
    summary: Listar notificações
    operationId: customerNotificationsList
    description: Paginação Laravel padrão + `unread_count` no meta/additional.
    security:
      - bearerAuth: []
    responses:
      '200':
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: array
                  items:
                    $ref: '../components/schemas.yaml#/Notification'
                unread_count:
                  type: integer
      '403':
        $ref: '../components/responses.yaml#/Forbidden'

customer-notifications-read:
  post:
    tags: [Customer]
    summary: Marcar notificação como lida
    operationId: customerNotificationsRead
    security:
      - bearerAuth: []
    parameters:
      - name: notification
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: UUID da notificação
    responses:
      '200':
        content:
          application/json:
            schema:
              type: object
              properties:
                ok:
                  type: boolean
      '403':
        description: Notificação não pertence ao customer

customer-notifications-read-all:
  post:
    tags: [Customer]
    summary: Marcar todas como lidas
    operationId: customerNotificationsReadAll
    security:
      - bearerAuth: []
    responses:
      '200':
        content:
          application/json:
            schema:
              type: object
              properties:
                ok:
                  type: boolean
