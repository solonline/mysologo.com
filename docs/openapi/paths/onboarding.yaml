onboarding-health:
  get:
    tags: [Onboarding]
    summary: Health check do domínio Onboarding
    operationId: onboardingHealth
    responses:
      '200':
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/HealthCheck'

onboarding-phone-send:
  post:
    tags: [Onboarding]
    summary: Enviar código SMS de verificação
    operationId: onboardingPhoneSend
    description: |
      Envia OTP para o telefone do customer autenticado.

      **`phone` é opcional.** Sem body (ou com o mesmo número da conta) reenvia
      para o telefone já registado.

      Se `phone` for um número **diferente** e o actual **ainda não estiver verificado**,
      o sistema corrige `customer.phone` e envia o SMS para o novo número
      (segunda hipótese quando o utilizador se enganou no registo).

      Se o telefone actual já estiver verificado, um número diferente devolve `422`
      (`phone_already_verified`) — nesse caso usar `POST /customer/phone`.

      Reenvio para um número já verificado devolve `status: failed` com mensagem informativa.
      Falha do gateway SMS ou WhatsApp → `424` com `SmsValidationResult` (`status: failed`).
    security:
      - bearerAuth: []
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              phone:
                type: string
                description: Só dígitos. Omitir para reenviar ao número da conta; enviar outro para corrigir um número ainda não verificado.
                example: '351912345678'
    responses:
      '200':
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/SmsValidationResult'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '422':
        $ref: '../components/responses.yaml#/ValidationError'
      '424':
        description: Falha ao enviar o código por SMS ou WhatsApp
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/SmsValidationResult'

onboarding-phone-validate:
  post:
    tags: [Onboarding]
    summary: Validar código SMS
    operationId: onboardingPhoneValidate
    description: |
      Confirma o código recebido por SMS. Em sucesso, `phone_verified` passa a `true` no perfil.

      Código inválido → `422` com `status: failed`.
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [code]
            properties:
              code:
                type: string
                example: '123456'
    responses:
      '200':
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/SmsValidationResult'
      '422':
        description: Código inválido
