tpa-health:
  get:
    tags: [Tpa]
    summary: Health check do domínio Tpa
    operationId: tpaHealth
    responses:
      '200':
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/HealthCheck'

tpa-link:
  post:
    tags: [Tpa]
    summary: Associar TPA a conta
    operationId: tpaLink
    description: |
      Vincula um terminal físico (serial único) a um customer após validar credenciais.

      **Uso típico:** primeira configuração do POS — operador faz login e associa o equipamento.

      Alternativa: `POST /auth/login-tpa` para sessão já ligada ao terminal.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, password, tpa_serial]
            properties:
              email:
                type: string
                format: email
              password:
                type: string
              tpa_serial:
                type: string
                description: Serial único do TPA (não pode estar já registado)
    responses:
      '200':
        description: TPA associado
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '422':
        $ref: '../components/responses.yaml#/ValidationError'
