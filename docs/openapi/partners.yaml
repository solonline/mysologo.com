openapi: 3.1.0

info:
  title: Yoop API — Parceiros
  version: 1.0.0
    description: |
      # API para integradores externos

      Documentação pública dos endpoints que merchants e parceiros podem consumir.

      ## Autenticação

      Todos os endpoints desta documentação usam:

      ```
      X-Merchant-Key: {sua_api_key}
      ```

      A API key é fornecida pela equipa Yoop após activação do merchant.

      ## Base URL

      ```
      https://api.seudominio.com/api
      ```

      ## Suporte

      Para novos endpoints ou ambientes de sandbox, contacte a equipa Yoop.
      Guias: payment requests, terminal POS e prompt para IA em `/docs/partners/guides`.

      ## Fluxo Payment Request

      1. `POST /merchant/payment-requests` → recebe `url`
      2. Redireccione o pagador para `url` (browser ou iframe)
      3. Opcional: use `webhook_url` para notificação HMAC

      ### Embutir (iframe)

      Card de pagamento: largura máx. **384px**. Iframe sugerido: `width=400`, `height=720`
      (altura dinâmica — aumentar com muitos `items`).

      ### Settlement (fundos)

      Quando o pagamento é concluído (`status=completed`):

      - O valor fica na wallet Yoop do merchant como **pending** até liquidação (`settlement_status=pending`, `funds_available=false` no webhook).
      - A disponibilização (`settlement_status=available`) ocorre após liquidação (fase futura).

      ## Fluxo Terminal (POS)

      1. `POST /merchant/terminal/connection-token` → `secret` para o SDK do terminal
      2. `POST /merchant/terminal/create-intent` com `Idempotency-Key`
      3. Passar `client_secret` ao reader no POS

