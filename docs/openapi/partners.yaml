openapi: 3.1.0

info:
  title: Yoop API — Parceiros
  version: 1.1.0
  x-logo:
    url: /yoop.jpeg
    altText: Yoop
    href: /docs/partners
  description: |
    # API para integradores externos

    Endpoints que merchants e parceiros podem consumir.
    A `api_key` é emitida na app Yoop após activação do merchant.

    Guias: [payment requests](/docs/partners/guides/payment-requests),
    [terminal POS](/docs/partners/guides/terminal-topup),
    [prompt para IA](/docs/partners/guides/ai-prompt).

    ## Autenticação

    Todos os endpoints desta documentação usam:

    ```
    X-Merchant-Key: {sua_api_key}
    ```

    Não usar Bearer/Sanctum nestes endpoints.

    ## Base URL

    ```
    https://api.yooppayments.eu/api
    ```

    ## Rate limits

    | Rota | Limite (por merchant) |
    |------|--------|
    | `POST /merchant/payment-requests` | 120/min |
    | `POST /merchant/terminal/connection-token` | 60/min |
    | `POST /merchant/terminal/create-intent` | 60/min |

    Resposta `429` com `Retry-After` se exceder. Os limites são por merchant, não por IP.

    ## Payment request

    1. `POST /merchant/payment-requests` → recebe `uuid` e `url`
    2. Abrir `url` no browser ou iframe (`?embed=1`)
    3. Quando o pagamento completa, a Yoop envia `POST` HMAC para `webhook_url`

    ### Iframe

    Card de pagamento: largura máx. **384px**. Iframe sugerido: `width=400`, `height=720`
    (altura dinâmica — aumentar com muitos `items`).

    Em embed, o sucesso fica no iframe. Ouvir `postMessage` (`source=yoop-pay`).
    `return_url` só é honrada em full-page.

    ### Webhook

    Headers: `X-Yoop-Timestamp`, `X-Yoop-Signature` (`v1=` + HMAC-SHA256), `X-Yoop-Delivery-Id`.

    Assinatura: `HMAC_SHA256(webhook_secret, "{timestamp}.{raw_body}")`.
    Rejeitar se `|now - timestamp| > 300s`. Até 10 retries com backoff.

    O primeiro webhook pode ter `fee_total`, `net_amount` e `funds_available_at` a `null`.
    Quando o Stripe confirma as taxas, a Yoop **reenvia** o mesmo evento — ser idempotente por `data.uuid`.

    ### Settlement

    Quando `status=completed`:

    | Campo | Significado |
    |-------|-------------|
    | `settlement_status=pending` / `funds_available=false` | Pago, fundos ainda a liquidar |
    | `settlement_status=available` / `funds_available=true` | Disponíveis na wallet Yoop do merchant |
    | `funds_available_at` | Data prevista (`YYYY-MM-DD`), ou `null` até o Stripe informar |

    ## Terminal (POS)

    1. `POST /merchant/terminal/connection-token` → `secret` para o SDK do terminal
    2. `POST /merchant/terminal/create-intent` com `Idempotency-Key` (UUID)
    3. Capture: `POST /stripe/terminal/{id}/capture` com Bearer do **customer** dono (não é esta API de parceiros — ver [guia](/docs/partners/guides/terminal-topup))

