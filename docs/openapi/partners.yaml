openapi: 3.1.0

info:
  title: Yoop API — Parceiros
  version: 1.0.0
  description: |
    # API para integradores externos

    Documentação pública dos endpoints que merchants e parceiros podem consumir.

    ## Autenticação

    Todos os endpoints desta documentação usam:

    ```
    X-Merchant-Key: {sua_api_key}
    ```

    A API key é fornecida pela equipa Yoop após activação do merchant.

    ## Base URL

    ```
    https://api.seudominio.com/api
    ```

    ## Suporte

    Para novos endpoints ou ambientes de sandbox, contacte a equipa Yoop.

    ## Fluxo Payment Request

    1. `POST /merchant/payment-requests` → recebe `url`
    2. Redireccione o pagador para `url`
    3. Opcional: use `callback_url` para notificação

    ### Settlement (fundos)

    Quando o pagamento é concluído (`status=completed`):

    - O valor fica na wallet Yoop do merchant como **pending** até liquidação Stripe (`settlement_status=pending`, `funds_available=false` no callback).
    - **Não** há funding Wallester imediato (diferente de top-up).
    - A disponibilização (`settlement_status=available`) ocorre após payout Stripe (fase futura).

    ## Fluxo Terminal (POS)

    1. `POST /merchant/terminal/connection-token` → `secret` para SDK
    2. `POST /merchant/terminal/create-intent` com `Idempotency-Key`
    3. Passar `client_secret` ao Stripe Terminal reader

