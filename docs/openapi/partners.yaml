openapi: 3.1.0

info:
  title: Yoop API — Parceiros
  version: 1.0.0
  description: |
    # API para integradores externos

    Documentação pública dos endpoints que merchants e parceiros podem consumir.

    ## Autenticação

    Todos os endpoints desta documentação usam:

    ```
    X-Merchant-Key: {sua_api_key}
    ```

    A API key é fornecida pela equipa Yoop após activação do merchant.

    ## Base URL

    ```
    https://api.seudominio.com/api
    ```

    ## Suporte

    Para novos endpoints ou ambientes de sandbox, contacte a equipa Yoop.
    Guias: payment requests, terminal POS e prompt para IA em `/docs/partners/guides`.

    ## Fluxo Payment Request

    1. `POST /merchant/payment-requests` → recebe `url`
    2. Redireccione o pagador para `url` (browser ou iframe)
    3. Opcional: use `webhook_url` para notificação HMAC

    ### Embutir (iframe)

    Card de pagamento: largura máx. **384px**. Iframe sugerido: `width=400`, `height=720`
    (altura dinâmica — aumentar com muitos `items`).

    ### Settlement (fundos)

    Quando o pagamento é concluído (`status=completed`):

    - O valor fica na wallet Yoop do merchant como **pending** até liquidação (`settlement_status=pending`, `funds_available=false` no webhook).
    - A disponibilização (`settlement_status=available`) ocorre após liquidação (fase futura).

    ## Fluxo Terminal (POS)

    1. `POST /merchant/terminal/connection-token` → `secret` para o SDK do terminal
    2. `POST /merchant/terminal/create-intent` com `Idempotency-Key`
    3. Passar `client_secret` ao reader no POS

servers:
  - url: /api
    description: API no host actual

tags:
  - name: Merchant
    description: Pagamentos e terminal para merchants integrados.

paths:
  /merchant/payment-requests:
    post:
      tags: [Merchant]
      summary: Criar pedido de pagamento
      operationId: merchantCreatePaymentRequest
      description: |
        Cria um link de pagamento publico (/pay/{uuid}) para o merchant autenticado.

        Autenticacao: X-Merchant-Key (nao usar Bearer neste endpoint).

        Rate limit: 10 pedidos/minuto.

        Fluxo tipico:
        1. Criar payment request e receber url
        2. Redirecionar cliente para url (browser ou iframe)
        3. Cliente paga na pagina Yoop
      security:
        - merchantKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount:
                  type: integer
                  minimum: 1
                  description: Valor em centimos
                description:
                  type: string
                  maxLength: 500
                external_reference:
                  type: string
                  maxLength: 255
                payer_name:
                  type: string
                payer_email:
                  type: string
                  format: email
                payer_phone:
                  type: string
                webhook_url:
                  type: string
                  format: uri
                metadata:
                  type: object
                  additionalProperties: true
                items:
                  type: array
                  items:
                    type: object
                    required: [name, quantity, unit_price]
                    properties:
                      name:
                        type: string
                      quantity:
                        type: number
                      unit_price:
                        type: integer
                        minimum: 0
                expires_in:
                  type: integer
                  minimum: 5
                  maximum: 1440
                language:
                  type: string
                  maxLength: 5
                payment_method_types:
                  type: array
                  items:
                    type: string
                    enum: [card, mb_way]
            example:
              amount: 5000
              description: "Order #123"
              external_reference: ORD-123
              items:
                - name: Cafe
                  quantity: 2
                  unit_price: 150
                - name: Croissant
                  quantity: 1
                  unit_price: 200
      responses:
        "201":
          description: Payment request criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  uuid:
                    type: string
                    format: uuid
                  amount:
                    type: integer
                  currency:
                    type: string
                  description:
                    type: string
                    nullable: true
                  external_reference:
                    type: string
                    nullable: true
                  payment_method_types:
                    type: array
                    nullable: true
                    items:
                      type: string
                  status:
                    type: string
                  settlement_status:
                    type: string
                    nullable: true
                  url:
                    type: string
                    format: uri
                  paid_at:
                    type: string
                    format: date-time
                    nullable: true
                  expires_at:
                    type: string
                    format: date-time
                    nullable: true
                  created_at:
                    type: string
                    format: date-time
                    nullable: true
              example:
                uuid: "9f3c2a1b-4d5e-6f70-8192-a3b4c5d6e7f8"
                amount: 5000
                currency: EUR
                description: "Order #123"
                external_reference: ORD-123
                payment_method_types:
                  - card
                  - mb_way
                status: pending
                settlement_status: null
                url: "https://yooppayments.eu/pay/9f3c2a1b-4d5e-6f70-8192-a3b4c5d6e7f8"
                paid_at: null
                expires_at: "2026-07-23T13:00:00+01:00"
                created_at: "2026-07-23T12:00:00+01:00"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /merchant/terminal/connection-token:
    $ref: './paths/merchant.yaml#/merchant-terminal-connection-token'
  /merchant/terminal/create-intent:
    $ref: './paths/merchant.yaml#/merchant-terminal-create-intent'

components:
  securitySchemes:
    merchantKey:
      $ref: './components/security.yaml#/merchantKey'
  schemas:
    ApiError:
      $ref: './components/schemas.yaml#/ApiError'
    ValidationError:
      $ref: './components/schemas.yaml#/ValidationError'
    MerchantPaymentRequest:
      $ref: './components/schemas.yaml#/MerchantPaymentRequest'
    TerminalConnectionToken:
      $ref: './components/schemas.yaml#/TerminalConnectionToken'
    TerminalPaymentIntent:
      $ref: './components/schemas.yaml#/TerminalPaymentIntent'
  responses:
    Unauthorized:
      $ref: './components/responses.yaml#/Unauthorized'
    ValidationError:
      $ref: './components/responses.yaml#/ValidationError'
    RateLimited:
      $ref: './components/responses.yaml#/RateLimited'

security:
  - merchantKey: []
