bearerAuth:
  type: http
  scheme: bearer
  bearerFormat: Sanctum
  description: |
    Token obtido em `POST /auth/login` ou registo.
    Enviar como `Authorization: Bearer {token}`.

merchantKey:
  type: apiKey
  in: header
  name: X-Merchant-Key
  description: |
    API key do merchant, emitida na app Yoop após activação (devolvida uma vez no
    registo / rotate). Usada em payment requests e terminal. Não usar Bearer.
