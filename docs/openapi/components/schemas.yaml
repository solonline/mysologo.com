ApiError:
  type: object
  required: [message, status]
  properties:
    message:
      type: string
      description: Mensagem legível para o utilizador ou cliente
    status:
      type: integer
      description: Código HTTP
    reason:
      type: string
      description: Código interno (apenas fora de produção)
    channel:
      type: string
      nullable: true
      description: Canal de log associado

ValidationError:
  type: object
  properties:
    message:
      type: string
    errors:
      type: object
      additionalProperties:
        type: array
        items:
          type: string

Customer:
  type: object
  properties:
    id:
      type: integer
    name:
      type: string
    username:
      type: string
      nullable: true
    type:
      type: string
      enum: [retail, corporate, responsible]
    email:
      type: string
      format: email
    language:
      type: string
      example: pt
    currency:
      type: string
      example: EUR
    avatar:
      type: string
      nullable: true
    email_verified_at:
      type: string
      format: date-time
      nullable: true
    phone:
      type: string
      nullable: true
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

LifecycleStatus:
  type: object
  description: Estado global da conta na plataforma Yoop (fonte de verdade para routing no app).
  properties:
    status:
      type: string
      description: |
        Código do ciclo de vida. Use este campo para decidir o ecrã seguinte no onboarding.
      enum:
        - PENDING_EMAIL_VERIFICATION
        - PENDING_PHONE_VERIFICATION
        - PENDING_IDENTITY_VERIFICATION
        - IDENTITY_UNDER_REVIEW
        - IDENTITY_REJECTED
        - PROVISIONING
        - PENDING_EBURY_ONBOARDING
        - EBURY_UNDER_REVIEW
        - EBURY_REJECTED
        - ACTIVE
        - SUSPENDED
        - BLOCKED
    label:
      type: string
      description: Texto legível do estado (ex. «Aguardando telefone»).
    is_negative:
      type: boolean
      description: '`true` quando o estado é recusa ou bloqueio (mostrar motivo ao utilizador).'
    reason:
      type: string
      nullable: true
      description: Motivo exposto ao customer quando `is_negative` é `true` ou há bloqueio parcial.

VerificationFlags:
  type: object
  description: Flags booleanas/string de verificação — resumo rápido sem abrir sub-objetos.
  properties:
    email:
      type: boolean
      description: Email confirmado (`email_verified_at` preenchido).
    phone:
      type: boolean
      description: Telefone actual confirmado por SMS.
    identity:
      type: string
      description: |
        Estado documental/KYC persistido na conta.
        Valores típicos: `PENDING`, `ANALYSING`, `APPROVED`, `DECLINED`.
        Corresponde a `customer.doc_status`.

OnboardingHints:
  type: object
  description: Dicas de onboarding específicas (ex. corporate sem responsável).
  properties:
    requires_responsible:
      type: boolean
      description: |
        `true` em contas corporate quando falta registar o responsável legal
        antes de iniciar KYC da empresa.
    message:
      type: string
      nullable: true
      description: Mensagem orientativa para o front (ex. responsável em falta).

IntegrationBlocker:
  type: object
  description: Bloqueio parcial ou total que impede certas acções.
  properties:
    scope:
      type: string
      description: |
        Âmbito do bloqueio: `platform`, `transactions`, `stripe`, `wallester`, `ebury`.
    reason:
      type: string
      description: Mensagem legível para o utilizador ou logs.
    source:
      type: string
      description: Origem do bloqueio (`yoop`, `stripe`, `wallester`, `ebury`, …).
    blocked_actions:
      type: array
      items:
        type: string
      description: |
        Acções afectadas (ex. `top_up`, `withdraw`, `receive_transfers`, `fx`).

Capabilities:
  type: object
  description: |
    O que o customer pode fazer **neste momento**, derivado de lifecycle + integrações.
    Preferir estes flags em vez de inferir permissões só pelo `lifecycle.status`.
  properties:
    can_use_platform:
      type: boolean
      description: Pode aceder à app além do fluxo de onboarding (não está globalmente bloqueado).
    can_transact:
      type: boolean
      description: Pode movimentar valores (wallet, P2P, top-up) — requer `ACTIVE` + parceiros OK.
    can_top_up_stripe:
      type: boolean
      description: Pode carregar saldo via Stripe (cartão / transferência bancária).
    can_withdraw_wallester:
      type: boolean
      description: Pode levantar / usar cartão Wallester.
    can_receive_ebury:
      type: boolean
      description: Pode receber transferências internacionais via Ebury.
    blockers:
      type: array
      items:
        $ref: '#/IntegrationBlocker'
      description: Lista de bloqueios activos (pode estar vazia).

IntegrationIbanDetails:
  type: object
  nullable: true
  description: |
    Dados bancários/IBAN do parceiro quando já provisionados.
    `null` quando a conta ainda não tem IBAN ou funding instructions.
  properties:
    iban:
      type: string
      description: IBAN principal para transferências.
    bic:
      type: string
      description: BIC/SWIFT (Stripe funding ou Wallester).
    account_holder_name:
      type: string
      description: Titular da conta bancária.
    country:
      type: string
      description: País do IBAN (Stripe funding).
    funding_status:
      type: string
      description: |
        Estado do IBAN de funding Stripe (`ACTIVE`, `PENDING`, `FAILED`, …).
        Apenas presente em `integrations.stripe.iban`.
    bank_transfer_type:
      type: string
      description: Tipo de transferência Stripe (ex. `eu_bank_transfer`).
    bank_name:
      type: string
      description: Nome do banco (Wallester).
    viban:
      type: string
      description: vIBAN alternativo quando diferente do `iban` principal.
    currency:
      type: string
      description: Moeda da conta Ebury.

IntegrationAccountState:
  type: object
  description: Estado operacional de um parceiro externo (Stripe, Wallester ou Ebury).
  properties:
    provider:
      type: string
      enum: [stripe, wallester, ebury]
    label:
      type: string
      description: Nome legível do parceiro.
    status:
      type: string
      nullable: true
      enum: [PENDING, ACTIVE, RESTRICTED, SUSPENDED, FAILED, CLOSED]
      description: |
        `null` — conta ainda não provisionada.
        `ACTIVE` — operacional.
        `RESTRICTED` — parcialmente limitada.
        `FAILED` / `SUSPENDED` / `CLOSED` — bloqueada pelo parceiro.
    reason:
      type: string
      nullable: true
      description: Último motivo de estado vindo do parceiro ou do backend.
    source:
      type: string
      nullable: true
      description: Quem alterou o estado (`yoop.onboarding`, `stripe.webhook`, …).
    updated_at:
      type: string
      format: date-time
      nullable: true
    blocked_actions:
      type: array
      items:
        type: string
      description: Acções bloqueadas por este parceiro neste estado.
    iban:
      $ref: '#/IntegrationIbanDetails'

IntegrationsMap:
  type: object
  description: |
    Mapa com uma entrada por parceiro. Chaves fixas: `stripe`, `wallester`, `ebury`.
  properties:
    stripe:
      $ref: '#/IntegrationAccountState'
    wallester:
      $ref: '#/IntegrationAccountState'
    ebury:
      $ref: '#/IntegrationAccountState'

IdentityVerificationSessionMetadata:
  type: object
  nullable: true
  description: Metadados da sessão KYC (provedor).
  properties:
    application_id:
      type: string
      format: uuid
      description: ID da aplicação/decision Didit — presente em webhooks `status.updated`.
    session_id:
      type: string
      format: uuid
      description: ID de sessão alternativo nos webhooks (pode diferir de `external_session_id`).

IdentityVerificationSessionAuth:
  type: object
  nullable: true
  description: |
    Sessão KYC no formato **AuthSession** (login/registo).
    Campos renomeados de forma agnóstica: `external_session_id`, `verification_url`.

    ⚠️ `POST /kyc/identity/session` usa nomes legados: `session_id`, `session_url`.
    Ver guia [AuthSession — identity_verification](/docs/guides/auth-session#identity_verification).
  required: [status]
  properties:
    id:
      type: integer
      description: ID interno Yoop (`customer_didit_sessions.id`).
    customer_id:
      type: integer
      description: Customer associado à sessão.
    status:
      type: string
      description: Estado da sessão no provedor (espelha `identity_verification.status`).
      enum:
        - Not Started
        - In Progress
        - In Review
        - Approved
        - Declined
        - Expired
        - Abandoned
    external_session_id:
      type: string
      description: ID da sessão no provedor KYC (Didit `session_id`).
    verification_url:
      type: string
      format: uri
      description: URL para WebView/browser — **campo principal para abrir o fluxo KYC**.
    callback_url:
      type: string
      format: uri
      nullable: true
      description: URL de retorno configurada na criação da sessão (front-end).
    metadata:
      $ref: '#/IdentityVerificationSessionMetadata'
    created_at:
      type: string
      format: date-time
      nullable: true
    updated_at:
      type: string
      format: date-time
      nullable: true

IdentityVerificationAuth:
  type: object
  nullable: true
  description: |
    Estado KYC em respostas **AuthSession** (login, registo, login-pin).

    📖 [Documentação completa](/docs/guides/auth-session#identity_verification)

    **Presença:**
    | Valor | Condição |
    |-------|----------|
    | `null` | `verification.identity === APPROVED` |
    | `{ status, session: null }` | In Review, Expired, Abandoned, ou sem URL accionável |
    | `{ status, session: {...} }` | Utilizador deve abrir `verification_url` |

    **Não confundir** com `verification.identity` (estado persistido `doc_status`).
  properties:
    status:
      type: string
      description: Estado da sessão no provedor KYC.
      enum:
        - Not Started
        - In Progress
        - In Review
        - Approved
        - Declined
        - Expired
        - Abandoned
    session:
      $ref: '#/IdentityVerificationSessionAuth'
  example:
    status: In Progress
    session:
      id: 12
      customer_id: 3
      status: In Progress
      external_session_id: d54203d5-1dee-44c8-bbdb-ebe1fc1418ef
      verification_url: https://verify.didit.me/en/session/example
      callback_url: https://yooppayments.eu/verification-pending
      metadata:
        application_id: c159a625-9dde-444c-990d-9accf2298448
        session_id: fdd2191b-ed54-411b-90f7-356265ff865f

AuthSession:
  type: object
  description: |
    Resposta padrão de `POST /auth/login`, `POST /auth/register-retail`,
    `POST /auth/register-corporate` e `POST /auth/login-pin`.

    📖 Referência completa: [AuthSession — campos JSON](/docs/guides/auth-session)
  required: [token, user, lifecycle, capabilities, integrations, onboarding, verification]
  properties:
    token:
      type: string
      description: Token Sanctum (`Authorization: Bearer {token}`). Expira em ~10 minutos no login por password.
    user:
      $ref: '#/Customer'
    lifecycle:
      $ref: '#/LifecycleStatus'
    capabilities:
      $ref: '#/Capabilities'
    integrations:
      $ref: '#/IntegrationsMap'
    onboarding:
      $ref: '#/OnboardingHints'
    verification:
      $ref: '#/VerificationFlags'
    identity_verification:
      $ref: '#/IdentityVerificationAuth'

MessageResponse:
  type: object
  properties:
    message:
      type: string

MerchantPaymentRequest:
  type: object
  properties:
    uuid:
      type: string
      format: uuid
    amount:
      type: integer
      description: Valor na menor unidade (cêntimos)
    currency:
      type: string
      example: EUR
    description:
      type: string
      nullable: true
    external_reference:
      type: string
      nullable: true
    payment_method_types:
      type: array
      nullable: true
      items:
        type: string
    status:
      type: string
      description: Estado do pedido (`pending`, `processing`, `completed`, `failed`, `expired`, `cancelled`)
    settlement_status:
      type: string
      nullable: true
      enum: [pending, available]
      description: |
        Presente quando `status=completed`. `null` enquanto o pedido está `pending`.
        `pending` = pago pelo cliente, fundos ainda a aguardar liquidação.
        `available` = liquidado e disponível na wallet Yoop do merchant.
    url:
      type: string
      format: uri
      description: URL pública de pagamento (`https://api.yooppayments.eu/pay/{uuid}`)
    paid_at:
      type: string
      format: date-time
      nullable: true
    expires_at:
      type: string
      format: date-time
      nullable: true
    created_at:
      type: string
      format: date-time
      nullable: true

MerchantPaymentWebhook:
  type: object
  description: |
    Payload `POST` enviado para `webhook_url` quando o payment request muda de estado
    (tipicamente `payment_request.completed`). Assinado com HMAC se o merchant tiver `webhook_secret`.
  properties:
    id:
      type: string
      description: Identificador do evento (`evt_{uuid}`)
      example: evt_9f3c2a1b-4d5e-6f70-8192-a3b4c5d6e7f8
    type:
      type: string
      description: `payment_request.{status}`
      example: payment_request.completed
    created:
      type: integer
      description: Unix timestamp da geração do evento
    data:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        status:
          type: string
          example: completed
        settlement_status:
          type: string
          nullable: true
          enum: [pending, available]
        funds_available:
          type: boolean
          description: `true` quando os fundos já estão disponíveis na wallet
        external_reference:
          type: string
          nullable: true
        amount:
          type: integer
          description: Valor cobrado ao pagador, em cêntimos
        fee_total:
          type: integer
          nullable: true
          description: Taxas (Stripe + plataforma) em cêntimos. `null` até o Stripe confirmar
        net_amount:
          type: integer
          nullable: true
          description: Líquido para o merchant (`amount - fee_total`). `null` até as taxas existirem
        currency:
          type: string
          example: EUR
        paid_at:
          type: string
          format: date-time
          nullable: true
        funds_available_at:
          type: string
          format: date
          nullable: true
          description: Data prevista (`YYYY-MM-DD`) em que os fundos ficam disponíveis
  example:
    id: evt_9f3c2a1b-4d5e-6f70-8192-a3b4c5d6e7f8
    type: payment_request.completed
    created: 1716547200
    data:
      uuid: 9f3c2a1b-4d5e-6f70-8192-a3b4c5d6e7f8
      status: completed
      settlement_status: pending
      funds_available: false
      external_reference: ORD-123
      amount: 5000
      fee_total: 200
      net_amount: 4800
      currency: EUR
      paid_at: "2026-07-23T12:05:00+01:00"
      funds_available_at: "2026-07-28"

TerminalConnectionToken:
  type: object
  properties:
    secret:
      type: string
      description: Secret para inicializar o SDK do terminal no POS

TerminalPaymentIntent:
  type: object
  properties:
    client_secret:
      type: string
      description: Client secret do PaymentIntent para o reader
    payment_intent:
      $ref: '#/StripePaymentIntentSession'

HealthCheck:
  type: object
  properties:
    domain:
      type: string
    status:
      type: string
      example: ok

CustomerProfile:
  type: object
  description: Perfil completo com flags de verificação
  properties:
    id:
      type: integer
    name:
      type: string
    username:
      type: string
    type:
      type: string
    email:
      type: string
    language:
      type: string
    currency:
      type: string
    phone:
      type: string
    status:
      type: string
    email_verified_at:
      type: string
      format: date-time
      nullable: true
    requires_responsible:
      type: boolean
    kyc_status:
      type: string
    email_verified:
      type: boolean
    document_verified:
      type: boolean
    phone_verified:
      type: boolean
    didit_session:
      $ref: '#/IdentitySession'
      nullable: true
    message:
      type: string
      nullable: true

PublicCustomer:
  type: object
  properties:
    id:
      type: integer
    name:
      type: string
    username:
      type: string
    avatar_url:
      type: string
      format: uri
      nullable: true

IdentitySession:
  type: object
  description: |
    Resposta de `POST /kyc/identity/session` (formato **legado** Didit).

    Para o formato usado no **login**, ver `IdentityVerificationSessionAuth`
    em AuthSession (`external_session_id`, `verification_url`).

    📖 [Comparação de campos](/docs/guides/auth-session#-nomes-diferentes-em-post-kycidentitysession)
  properties:
    id:
      type: integer
    customer_id:
      type: integer
    status:
      type: string
    session_id:
      type: string
      description: Equivalente a `external_session_id` no AuthSession.
    workflow_id:
      type: string
      description: Workflow Didit (KYC individual ou KYB corporate).
    session_url:
      type: string
      format: uri
      description: Equivalente a `verification_url` no AuthSession.
    callback:
      type: string
      format: uri
      nullable: true
      description: Equivalente a `callback_url` no AuthSession.
    metadata:
      $ref: '#/IdentityVerificationSessionMetadata'
    created_at:
      type: string
      format: date-time
      nullable: true
    updated_at:
      type: string
      format: date-time
      nullable: true

SmsValidationResult:
  type: object
  properties:
    message:
      type: string
    status:
      type: string
      enum: [success, failed]
    phone:
      type: string
      description: Número para o qual o SMS foi enviado (`POST /onboarding/phone/send`).

PhoneChangeResult:
  type: object
  description: Resposta de `POST /customer/phone` (pedido de alteração, perfil ainda não actualizado).
  properties:
    status:
      type: string
      enum: [success, failed]
    phone:
      type: string
      description: Novo número para o qual o SMS foi enviado.
    phone_verified:
      type: boolean
      description: Estado do telefone **actual** da conta (ainda o antigo até ao confirm).
    message:
      type: string

WalletDashboard:
  type: object
  properties:
    balances:
      type: array
      items:
        type: object
    transactions:
      type: array
      items:
        $ref: '#/Transaction'

AccountDetails:
  type: object
  properties:
    stripe:
      type: object
      nullable: true
      description: Conta Stripe / funding instructions
    wallester:
      type: object
      nullable: true
      description: Conta Wallester / IBAN

Transaction:
  type: object
  properties:
    id:
      type: integer
    type:
      type: string
    type_label:
      type: string
      description: Nome de apresentação (ex. Transferência entre contas, Carregamento)
    direction:
      type: string
    amount:
      type: integer
    fee:
      type: integer
    net_amount:
      type: integer
    currency:
      type: string
    status:
      type: string
    payment_method_type:
      type: string
      nullable: true
    description:
      type: string
      nullable: true
    settles_at:
      type: string
      format: date-time
      nullable: true
    created_at:
      type: string
      format: date-time

FundingPartnerMovement:
  type: object
  description: |
    Movimento local Wallester (`funding_partner_movements`).
    Compras com câmbio são unificadas: `amount` = total na moeda da conta.
  properties:
    id:
      type: integer
    provider:
      type: string
      example: wallester
    external_account_id:
      type: string
    direction:
      type: string
      enum: [in, out]
    type:
      type: string
      enum: [card_purchase, card_refund, account_transfer, inbound_payment, fee]
    type_label:
      type: string
      description: Nome de apresentação (ex. Transferência entre contas, Crédito Yoop, Compra cartão)
    source_label:
      type: string
      description: Origem visível (Wallester, Crédito Yoop, Débito Yoop)
    is_p2p:
      type: boolean
    amount:
      type: integer
      description: Total debitado/creditado na moeda da conta (cêntimos). Compra FX = compra convertida + taxa.
    currency:
      type: string
      minLength: 3
      maxLength: 3
      description: Moeda da conta / conversão
    original_amount:
      type: integer
      nullable: true
      description: Valor da compra na moeda do comerciante (cêntimos)
    original_currency:
      type: string
      nullable: true
      minLength: 3
      maxLength: 3
      description: Moeda da compra no comerciante
    fees_amount:
      type: integer
      nullable: true
      description: Valor do câmbio na moeda da conta (cêntimos). Não é o rácio FX.
    transfer_group_id:
      type: string
      nullable: true
    counterparty_external_account_id:
      type: string
      nullable: true
    counterparty:
      type: object
      nullable: true
      description: Contraparte em transferências entre contas (P2P)
      properties:
        id:
          type: integer
        name:
          type: string
        username:
          type: string
        avatar_url:
          type: string
          nullable: true
        role:
          type: string
          enum: [sender, recipient]
    partner_external_id:
      type: string
      nullable: true
    status:
      type: string
    source:
      type: string
      enum: [webhook, sync, api]
    description:
      type: string
      nullable: true
    failure_reason:
      type: string
      nullable: true
    created_at:
      type: string
      format: date-time
      nullable: true

